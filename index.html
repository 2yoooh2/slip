<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSG 영수증 PDF 추출기</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

  <header class="app-header">
    <div class="app-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2h9l3 3v17l-3-1.5-3 1.5-3-1.5-3 1.5V2z"/>
        <path d="M9 8h6M9 12h6M9 16h3"/>
      </svg>
    </div>
    <div>
      <h1>SSG 영수증 PDF 추출기</h1>
      <p class="app-desc">SSG 영수증 PDF를 업로드하면 제품명·구매금액·수량을 자동으로 추출합니다.</p>
    </div>
  </header>

  <section class="upload-section">
    <div id="dropZone" class="drop-zone">
      <input type="file" id="fileInput" accept="application/pdf" multiple hidden>
      <div class="drop-zone-content">
        <div class="drop-zone-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
            <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
        </div>
        <p class="drop-zone-title">PDF 파일을 이곳에 끌어다 놓거나 (여러 개 선택 가능)</p>
        <button type="button" id="fileSelectBtn" class="btn btn-primary">파일 선택</button>
        <p id="fileNameDisplay" class="file-name"></p>
      </div>
    </div>
  </section>

  <section class="guide-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 16v-5M12 8h.01"/>
    </svg>
    <p>Excel의 B열 시작 셀을 선택한 후 붙여넣으세요.<br>
    주문일자는 B열, 제품명은 C열, 구매금액은 E열, 수량은 G열에 입력됩니다.</p>
  </section>

  <section id="resultSection" class="result-section">

    <div class="result-toolbar">
      <div class="result-count">추출된 상품: <strong id="itemCount">0</strong>개</div>
      <div class="result-actions">
        <button type="button" id="copyAllBtn" class="btn btn-primary">전체 상품 복사</button>
        <button type="button" id="resetBtn" class="btn btn-outline">초기화</button>
      </div>
    </div>

    <div class="table-wrap">
      <table id="resultTable" class="result-table">
        <thead>
          <tr>
            <th class="col-date">주문일자</th>
            <th class="col-name">제품명</th>
            <th class="col-amount">구매금액</th>
            <th class="col-qty">수량</th>
            <th class="col-actions">작업</th>
          </tr>
        </thead>
        <tbody id="resultTbody"></tbody>
      </table>
    </div>

    <div id="emptyState" class="empty-state">
      <div class="empty-state-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 8v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/>
          <path d="M3 8l3-5h12l3 5"/>
          <path d="M3 8h18"/>
          <path d="M9 12a3 3 0 0 0 6 0"/>
        </svg>
      </div>
      <p>PDF를 업로드하면 추출된 상품 목록이 여기에 표시됩니다.</p>
    </div>

  </section>

  <div id="errorBanner" class="error-banner" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 9v4M12 17h.01"/>
      <path d="M10.29 3.86 1.82 18a1 1 0 0 0 .86 1.5h18.64a1 1 0 0 0 .86-1.5L13.71 3.86a1 1 0 0 0-1.72 0z"/>
    </svg>
    <p id="errorBannerText"></p>
  </div>

</div>

<div id="toast" class="toast"></div>

<script src="js/lib/pdf.min.js"></script>
<script src="js/parser.js"></script>
<script src="js/script.js"></script>
</body>
</html>
